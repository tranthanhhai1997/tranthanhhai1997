<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering signal, from backend architecture to AI audio">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060C"/>
      <stop offset="0.5" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="fframe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="fround"><rect x="3" y="3" width="994" height="144" rx="20"/></clipPath>
    <style>
      .fmono { font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace; }
      @keyframes fdash { to { stroke-dashoffset:-800; } }
      .fw { stroke-dasharray:4 8; animation:fdash 14s linear infinite; }
    </style>
  </defs>
  <g clip-path="url(#fround)">
    <rect x="3" y="3" width="994" height="144" fill="url(#fbg)"/>
    <path class="fw" d="M0 75 Q 60 40 120 75 T 240 75 T 360 75 T 480 75 T 600 75 T 720 75 T 840 75 T 960 75 T 1080 75"
          fill="none" stroke="url(#wave)" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M0 75 Q 60 52 120 75 T 240 75 T 360 75 T 480 75 T 600 75 T 720 75 T 840 75 T 960 75"
          fill="none" stroke="url(#wave)" stroke-opacity="0.5" stroke-width="2.5"/>
  </g>
  <rect x="3" y="3" width="994" height="144" rx="20" fill="none" stroke="url(#fframe)" stroke-width="1.2"/>
  <text x="500" y="62" text-anchor="middle" class="fmono" font-size="15" fill="#E2E8F0" letter-spacing="3" font-weight="600">
    FROM BACKEND ARCHITECTURE → TO THE FRONTIER OF AI AUDIO
  </text>
  <text x="500" y="104" text-anchor="middle" class="fmono" font-size="11" fill="#475569" letter-spacing="4">
    CLEAN CODE · MINIMAL LATENCY · ZERO UNNECESSARY DEPENDENCIES
  </text>
</svg>
