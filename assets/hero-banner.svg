<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tran Thanh Hai - Senior Software Engineer, Audio DSP and AI Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070E"/>
      <stop offset="0.5" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="12%" cy="18%" r="55%">
      <stop offset="0" stop-color="#0284C7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="82%" r="55%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="78%" cy="20%" r="40%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="4" y="4" width="992" height="352" rx="24"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace; }
      .sans { font-family: 'Segoe UI',Inter,system-ui,-apple-system,sans-serif; }
      @keyframes eq { 0%,100%{transform:scaleY(.30)} 50%{transform:scaleY(1)} }
      @keyframes dash { to { stroke-dashoffset: -1000; } }
      @keyframes blink { 0%,60%{opacity:1} 80%,100%{opacity:.15} }
      .b { transform-box: fill-box; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite; }
      .flow { stroke-dasharray: 6 10; animation: dash 18s linear infinite; }
      .dot { animation: blink 1.8s steps(1) infinite; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect x="4" y="4" width="992" height="352" fill="url(#bg)"/>
    <rect x="4" y="4" width="992" height="352" fill="url(#grid)"/>
    <rect x="4" y="4" width="992" height="352" fill="url(#glowA)"/>
    <rect x="4" y="4" width="992" height="352" fill="url(#glowB)"/>
    <rect x="4" y="4" width="992" height="352" fill="url(#glowC)"/>

    <!-- flowing waveform lines -->
    <path class="flow" d="M-20 120 Q 120 60 260 120 T 540 120 T 820 120 T 1100 120" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2"/>
    <path class="flow" d="M-20 250 Q 140 200 300 250 T 620 250 T 940 250 T 1200 250" fill="none" stroke="#818CF8" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <rect x="4" y="4" width="992" height="352" rx="24" fill="none" stroke="url(#frame)" stroke-width="1.5"/>

  <!-- status bar -->
  <g class="mono">
    <circle class="dot" cx="40" cy="44" r="4" fill="#2DD4BF"/>
    <text x="54" y="48" fill="#5EEAD4" font-size="12" letter-spacing="3">AVAILABLE FOR ARCHITECTURE &amp; AI COLLABORATIONS</text>
    <text x="960" y="48" fill="#475569" font-size="12" letter-spacing="2" text-anchor="end">SYS_STATUS: ACTIVE // 2026</text>
  </g>

  <!-- name -->
  <text x="40" y="150" class="sans" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Trần Thanh Hải</text>
  <text x="44" y="188" class="mono" font-size="17" fill="url(#accent)" font-weight="600" letter-spacing="4">SENIOR SOFTWARE ENGINEER · AUDIO DSP &amp; AI SYSTEMS</text>

  <text x="44" y="226" class="sans" font-size="15" fill="#94A3B8">Robust <tspan fill="#E2E8F0" font-weight="600">PHP &amp; Laravel backend architecture</tspan>, evolved into applied</text>
  <text x="44" y="249" class="sans" font-size="15" fill="#60A5FA" font-weight="600">Deep-Learning Audio DSP<tspan fill="#94A3B8" font-weight="400">, forced alignment &amp; zero-dependency reverse engineering.</tspan></text>

  <!-- capability chips -->
  <g class="mono" font-size="12" fill="#CBD5E1">
    <g transform="translate(44,276)">
      <rect width="196" height="30" rx="15" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="18" cy="15" r="3.5" fill="#38BDF8"/>
      <text x="32" y="19">PHP · Laravel · MySQL</text>
    </g>
    <g transform="translate(252,276)">
      <rect width="206" height="30" rx="15" fill="#0F172A" stroke="#2E2A5F" stroke-width="1"/>
      <circle cx="18" cy="15" r="3.5" fill="#818CF8"/>
      <text x="32" y="19">Demucs v4 · Audio Stems</text>
    </g>
    <g transform="translate(470,276)">
      <rect width="196" height="30" rx="15" fill="#0F172A" stroke="#1E4F45" stroke-width="1"/>
      <circle cx="18" cy="15" r="3.5" fill="#2DD4BF"/>
      <text x="32" y="19">MMS·FA · CTC Alignment</text>
    </g>
    <g transform="translate(678,276)">
      <rect width="208" height="30" rx="15" fill="#0F172A" stroke="#3A2A52" stroke-width="1"/>
      <circle cx="18" cy="15" r="3.5" fill="#C084FC"/>
      <text x="32" y="19">Chroma-12 FFT Fingerprint</text>
    </g>
  </g>

  <!-- animated equalizer -->
  <g transform="translate(812,96)">
    <g filter="url(#soft)" opacity="0.5">
      <rect class="b" x="0"   y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:0s"/>
      <rect class="b" x="20"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.2s"/>
      <rect class="b" x="40"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.4s"/>
      <rect class="b" x="60"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.6s"/>
      <rect class="b" x="80"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.8s"/>
      <rect class="b" x="100" y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:1s"/>
    </g>
    <rect class="b" x="0"   y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:0s"/>
    <rect class="b" x="20"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.2s"/>
    <rect class="b" x="40"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.4s"/>
    <rect class="b" x="60"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.6s"/>
    <rect class="b" x="80"  y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:.8s"/>
    <rect class="b" x="100" y="0" width="11" height="84" rx="5" fill="url(#bar)" style="animation-delay:1s"/>
  </g>
</svg>
